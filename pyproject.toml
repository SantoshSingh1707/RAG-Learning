[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-learning"
version = "0.1.0"
description = "A production-minded conversational retrieval-augmented generation application."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.5.2",
    "charset-normalizer>=3.4",
    "easyocr>=1.7.2",
    "fonttools>=4.60",
    "langchain-core>=1.2.17",
    "langchain-mistralai>=1.1.1",
    "langchain-text-splitters>=1.1.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pymupdf>=1.27.1",
    "pypdf>=6.7.5",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.2.3",
    "streamlit>=1.55.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "langchain-ollama>=0.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
notebook = [
    "ipykernel>=7.2",
    "langchain-community>=0.4.1",
    "scikit-learn>=1.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv.sources]
# torch and torchvision resolve from PyPI rather than from the cu124 index.
# What that changes is platform-specific, so do not generalise from one
# platform to another. Both were measured on this repository's CI and on a
# Windows dev machine.
#
#   Windows / macOS: the default PyPI wheel is a CPU-only build. On Windows
#     this resolved to torch 2.14.0+cpu with torch.version.cuda of None, so
#     embedding runs on the CPU. The cost is small -- 384-dimension embeddings
#     at ~420 chunks/sec, about 2 seconds per 1000 chunks and 14 ms query
#     latency -- so a full re-index of ~127k chunks takes minutes rather than
#     seconds. Ollama ships its own CUDA runtime, so the chat model is
#     unaffected and still uses the GPU.
#
#   Linux: the PyPI wheel does carry CUDA. uv.lock resolves nvidia-cudnn-cu13,
#     nvidia-nccl-cu13, cuda-toolkit, cuda-bindings and triton alongside torch,
#     all gated on sys_platform == 'linux'. A CI run downloads about 3.2 GB
#     across 48 wheels, of which torch is 529 MB and triton 237 MB. So the
#     cu124 index was not what made Linux heavy, and restoring it would not
#     make Linux light.
#
# To get GPU embeddings back on Windows or macOS, pin an explicit CUDA index
# here. Scoping it with a sys_platform marker will not shrink Linux CI, which
# already resolves CUDA wheels from PyPI. This is not configured today: torch
# and torchvision deliberately have no [tool.uv.sources] entry, so both resolve
# from PyPI on every platform.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Tests import application modules (src.*, app, migrate_legacy_index) from the
# repository root. Without this, a bare `pytest` run cannot resolve them and
# collection fails; `python -m pytest` would hide that by injecting the CWD.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
