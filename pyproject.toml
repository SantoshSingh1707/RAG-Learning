[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-learning"
version = "0.1.0"
description = "A production-minded conversational retrieval-augmented generation application."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.5.2",
    "charset-normalizer>=3.4",
    "easyocr>=1.7.2",
    "fonttools>=4.60",
    "langchain-core>=1.2.17",
    "langchain-mistralai>=1.1.1",
    "langchain-text-splitters>=1.1.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pymupdf>=1.27.1",
    "pypdf>=6.7.5",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.2.3",
    "streamlit>=1.55.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "langchain-ollama>=0.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
notebook = [
    "ipykernel>=7.2",
    "langchain-community>=0.4.1",
    "scikit-learn>=1.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv.sources]
# torch and torchvision resolve from PyPI. The previous explicit pin to the
# cu124 index forced every environment, including CPU-only CI runners, to pull
# ~2.5 GB of CUDA wheels. The default PyPI wheels already bundle CUDA on the
# platforms that support it, so the index added cost without adding capability.
# Pin an explicit index here only if you need a specific CUDA build.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Tests import application modules (src.*, app, migrate_legacy_index) from the
# repository root. Without this, a bare `pytest` run cannot resolve them and
# collection fails; `python -m pytest` would hide that by injecting the CWD.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
